services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: connect4
      POSTGRES_USER: connect4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connect4}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/connect4
      SPRING_DATASOURCE_USERNAME: connect4
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-connect4}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
