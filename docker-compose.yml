services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: connect4
      POSTGRES_USER: connect4
      POSTGRES_PASSWORD: connect4
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
